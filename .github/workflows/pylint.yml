name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          pip install poetry pylint
          poetry install
      - name: Run pylint
        run: pylint wallger

  ci:
    name: CI
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
